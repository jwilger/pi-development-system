---
# Template: local gates that mirror CI so a red build is found before the push.
# Adapt the commands to the repository's toolchain.
# Keep CI re-running every gate.
commit-msg:
  commands:
    conventional:
      run: your-commit-message-check {1}

pre-commit:
  parallel: true
  commands:
    typecheck:
      run: npx tsc --noEmit
    lint:
      run: biome check .
    test:
      run: npm test
