# Hooks are installed by the nix devshell (shellHook). Skipping them is
# possible, but CI re-runs every gate and fails the build.
commit-msg:
  commands:
    build-gate:
      run: node scripts/build-gate.ts --message-file {1}

pre-commit:
  parallel: true
  commands:
    version:
      run: node scripts/check-version.ts --staged
    typecheck:
      run: npx tsc --noEmit
    lint:
      run: biome check .
    knip:
      run: npx knip
    markdown:
      glob: "*.md"
      run: markdownlint-cli2 {staged_files}
    test:
      run: npm test
    jev-fixtures:
      run: node scripts/run-jev-fixtures.ts --staged
    nix-format:
      glob: "*.nix"
      run: nixfmt --check {staged_files}
    actionlint:
      glob: ".github/workflows/*.yml"
      run: actionlint
