name: CI/CD

# Every push to main is gated, tested, released and published. The file must
# stay named publish.yml: npm's trusted publisher is bound to this filename.
on:
  push:
    branches: [main]

concurrency:
  group: ci-main
  cancel-in-progress: false

permissions:
  contents: read

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  gate:
    name: Release gates
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # read previous run results and failed-job logs
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      # v31
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - name: Install dependencies
        run: nix develop -c npm ci
      - name: Build gate (only fix(ci) commits on a broken build)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          nix develop -c node scripts/build-gate.ts --ci \
            --before "${{ github.event.before }}" --after "${{ github.sha }}"
      - name: Semantic version gate
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: |
          nix develop -c node scripts/check-version.ts --ci \
            --before "${{ github.event.before }}" --after "${{ github.sha }}"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # v31
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - run: nix develop -c npm ci
      - run: nix develop -c npx tsc --noEmit
      - run: nix develop -c biome check .
      - run: nix develop -c npx knip
      - run: nix develop -c ast-grep scan
      - run: nix develop -c markdownlint-cli2
      - run: nix develop -c sh -c 'nixfmt --check *.nix'
      - run: nix develop -c actionlint

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
          fetch-depth: 0
      # v31
      - uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24
      - run: nix develop -c npm ci
      - run: nix develop -c npm test
      - name: Live Jev fixtures (only when Jev-facing paths changed)
        env:
          TYPESAFE_API_KEY: ${{ secrets.TYPESAFE_API_KEY }}
        run: nix develop -c node scripts/run-jev-fixtures.ts --before ${{ github.event.before }}

  release:
    name: GitHub release
    needs: [gate, lint, test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Create release if this version is new
        run: |
          version="v$(node -p "require('./package.json').version")"
          if gh release view "$version" >/dev/null 2>&1; then
            echo "$version already released; nothing to do"
          else
            gh release create "$version" --target "$GITHUB_SHA" \
              --title "$version" --generate-notes
          fi

  publish:
    name: Publish to npm
    needs: [release]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC)
    steps:
      # v4
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          # Node 24 ships npm >= 11.5.1, required for trusted publishing
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Publish if this version is not on npm yet
        run: |
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "$name@$version" version >/dev/null 2>&1; then
            echo "$name@$version already published"
          else
            npm publish --access public
          fi
