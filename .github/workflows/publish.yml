name: Publish to npm

# Trusted publishing (OIDC): no NPM_TOKEN secret. The trusted publisher on
# npmjs.com must be configured for this repository + workflow filename.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # required for npm trusted publishing

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Node 24 ships npm >= 11.5.1, required for trusted publishing
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Verify tag matches package.json version
        run: |
          pkg="v$(node -p "require('./package.json').version")"
          if [ "$pkg" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME != package.json version $pkg" >&2
            exit 1
          fi

      - name: Publish
        run: npm publish --access public
